name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install virtual display and JavaFX runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - name: Verify on Linux with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -ntp clean verify
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: mvn -B -ntp clean verify
      - name: Check offline build using the populated cache on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -o -B -ntp clean verify
      - name: Check offline build using the populated cache on Windows
        if: runner.os == 'Windows'
        run: mvn -o -B -ntp clean verify
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn
